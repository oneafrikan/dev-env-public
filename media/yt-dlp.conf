# yt-dlp shared config -- symlinked to ~/.config/yt-dlp/config by
# media/install-yt-dlp.sh. Applies to every yt-dlp run (wrapper or bare).
# Edit THIS file in the repo; the symlink picks it up. Command-line flags
# override anything here.

# JS runtime for YouTube's JS challenges. Recent yt-dlp needs one; deno is
# the default but node (>= 22) is what these boxes have. Ref:
# https://github.com/yt-dlp/yt-dlp/wiki/EJS
--js-runtimes node

# Output name: title (capped at 200 bytes) + id, relative to the cwd.
# The id keeps same-titled videos apart and makes archive hits traceable.
-o "%(title).200B [%(id)s].%(ext)s"

# Write title/uploader/date/description into the file's tags.
--embed-metadata

# Idempotency: ids already downloaded are skipped on re-run. This is the
# default for bare `yt-dlp`; yt-dl.sh overrides it with archive-video.txt /
# archive-audio.txt so fetching the audio of a video you already have is not
# silently skipped (same id).
# LIMITATION: yt-dlp config files can't read $XDG_CONFIG_HOME when it is
# unset, so this path is fixed at ~/.config/yt-dlp. The wrapper and the
# installer do honour XDG_CONFIG_HOME; bare yt-dlp does not.
--download-archive ~/.config/yt-dlp/archive.txt

# Cookies (age-gated / members / logged-in-only videos). OFF by default:
# it reads your live browser profile, so enable it only when needed.
# Browsers: firefox, chrome, chromium, brave, edge, safari, ...
# One-off alternative: yt-dl.sh URL --cookies-from-browser firefox
#--cookies-from-browser firefox
